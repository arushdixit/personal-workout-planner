name: Keep Supabase Awake

on:
  schedule:
    # Runs every 3 days at 00:00 UTC (well within the 7-day pause limit)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to run it manually from the GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/routines?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
